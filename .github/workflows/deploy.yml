name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Syntax check
        run: |
          python -m py_compile app/main.py

      - name: Validate example config
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("config/servers.example.yaml")
          data = yaml.safe_load(path.read_text(encoding="utf-8"))
          required = {"refresh_interval_sec", "ssh", "servers"}
          missing = required.difference(data.keys())
          if missing:
              raise SystemExit(f"Missing keys in {path}: {sorted(missing)}")
          if not isinstance(data.get("servers"), list):
              raise SystemExit("config.servers must be a list")
          print("config validation: OK")
          PY

      - name: Run tests
        run: |
          pytest -q

  # Deployment is pull-based: the host polls GitHub every 5 minutes via
  # dash-autodeploy.timer and rolls back if /api/health stays down.
  # See deploy/ for the script and units. GitHub cannot reach the host —
  # only the dashboard port is exposed, SSH is not.
